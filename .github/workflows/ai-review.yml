name: AI review
on:
  # Review only after PR Pre-Merge Check finishes; it succeeds only when Code Quality
  # Check and Test Quality Check (which needs every OS test job) succeed.
  workflow_run:
    workflows: [PR Pre-Merge Check]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to review (including an authorized fork PR)
        required: true
        type: number
      head-sha:
        description: Full head commit SHA to review; must be the PR's current head
        required: true
        type: string
# Cancellation stops only older runs; it never touches published reviews or threads.
concurrency:
  group: ai-review-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr-number }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  pull-requests: write
jobs:
  size:
    name: PR size gate
    # Failed, cancelled or fork CI runs (no PR association) skip the review.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0].number)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      tier: ${{ steps.gate.outputs.tier }}
      draft: ${{ steps.gate.outputs.draft }}
      head: ${{ steps.gate.outputs.head }}
      base: ${{ steps.gate.outputs.base }}
    steps:
      # Trusted base checkout only; the PR head is never checked out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Classify PR size and post status
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr-number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/pr_size_gate.py
  resolve-reviewer:
    needs: size
    if: >-
      needs.size.outputs.tier == 'auto' &&
      (github.event_name == 'workflow_dispatch' || needs.size.outputs.draft == 'false')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve reviewer main to a commit
        id: resolve
        shell: bash
        run: |
          ref=$(git ls-remote --exit-code https://github.com/njalexander93/ai-reviewer.git refs/heads/main)
          sha=${ref%%$'\t'*}
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  review:
    needs: [size, resolve-reviewer]
    uses: njalexander93/ai-reviewer/.github/workflows/review.yml@main
    with:
      # Convert the dispatch input explicitly for the reviewer's typed number input.
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number || fromJSON(inputs.pr-number) }}
      implementation-ref: ${{ needs.resolve-reviewer.outputs.sha }}
      expected-head-sha: ${{ needs.size.outputs.head }}
      expected-base-sha: ${{ needs.size.outputs.base }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_REVIEWER_TOKEN: ${{ secrets.AI_REVIEWER_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
