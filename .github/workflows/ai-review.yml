name: AI review
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to review (including an authorized fork PR)
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: write
jobs:
  resolve-reviewer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve reviewer main to a commit
        id: resolve
        shell: bash
        run: |
          ref=$(git ls-remote --exit-code https://github.com/njalexander93/ai-reviewer.git refs/heads/main)
          sha=${ref%%$'\t'*}
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  review:
    needs: resolve-reviewer
    uses: njalexander93/ai-reviewer/.github/workflows/review.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
      implementation-ref: ${{ needs.resolve-reviewer.outputs.sha }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_REVIEWER_TOKEN: ${{ secrets.AI_REVIEWER_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
