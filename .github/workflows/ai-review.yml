name: AI review
on:
  # Review only after PR Pre-Merge Check finishes; it succeeds only when PR Size Check,
  # Code Quality Check and Test Quality Check (which needs every OS test job) succeed.
  workflow_run:
    workflows: [PR Pre-Merge Check]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to review (including an authorized fork PR)
        required: true
        type: number
      head-sha:
        description: Full head commit SHA to review; must be the PR's current head
        required: true
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: write
jobs:
  admit:
    name: Admit review
    # Failed, cancelled or fork CI runs (no PR association) skip the review. Every
    # admitted run, including a manual one, also needs the head's CI to have passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0].number)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.admit.outputs.ready }}
      head: ${{ steps.admit.outputs.head }}
      base: ${{ steps.admit.outputs.base }}
    steps:
      # Trusted base checkout only; the PR head is never checked out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Recount size from trusted code; the PR can redefine its own CI size job.
      - name: Check PR size
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr-number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head-sha }}
        run: python3 scripts/pr_size_gate.py
      - name: Require passing CI for the current head
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr-number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head-sha }}
        run: python3 -m scripts.pr_review_admit
  resolve-reviewer:
    needs: admit
    if: github.event_name == 'workflow_dispatch' || needs.admit.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve reviewer main to a commit
        id: resolve
        shell: bash
        run: |
          ref=$(git ls-remote --exit-code https://github.com/njalexander93/ai-reviewer.git refs/heads/main)
          sha=${ref%%$'\t'*}
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  review:
    needs: [admit, resolve-reviewer]
    # Only an admitted review cancels an older one, so rejected CI completions cannot.
    # Cancellation never touches published reviews or threads.
    concurrency:
      group: ai-review-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr-number }}
      cancel-in-progress: true
    uses: njalexander93/ai-reviewer/.github/workflows/review.yml@main
    with:
      # Convert the dispatch input explicitly for the reviewer's typed number input.
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number || fromJSON(inputs.pr-number) }}
      implementation-ref: ${{ needs.resolve-reviewer.outputs.sha }}
      expected-head-sha: ${{ needs.admit.outputs.head }}
      expected-base-sha: ${{ needs.admit.outputs.base }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_REVIEWER_TOKEN: ${{ secrets.AI_REVIEWER_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
  notify:
    needs: [admit, review]
    # Announce only when the AI reviewer approved: the reviewer exposes no verdict output,
    # so this runs after every completed review and the ready check posts only on approval.
    if: needs.review.result == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-announce.yml
    with:
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number || fromJSON(inputs.pr-number) }}
      head-sha: ${{ needs.admit.outputs.head }}
      base-sha: ${{ needs.admit.outputs.base }}
    secrets:
      DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
      AI_REVIEWER_TOKEN: ${{ secrets.AI_REVIEWER_TOKEN }}
