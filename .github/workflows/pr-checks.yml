name: PR Pre-Merge Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-pre-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Code Quality Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - name: Select interpreter and install locked dependencies
        run: |
          python -c "import subprocess, sys; subprocess.run(['poetry', 'env', 'use', sys.executable], check=True)"
          python scripts/dev.py install
      - name: Configuration
        if: ${{ !cancelled() }}
        run: poetry run python scripts/dev.py validate-config --evidence-dir "$RUNNER_TEMP/python-quality/config"
      - name: Formatting
        if: ${{ !cancelled() }}
        run: poetry run python scripts/dev.py format-check --evidence-dir "$RUNNER_TEMP/python-quality/format"
      - name: Lint
        if: ${{ !cancelled() }}
        run: poetry run python scripts/dev.py lint --evidence-dir "$RUNNER_TEMP/python-quality/lint"
      - name: Types
        if: ${{ !cancelled() }}
        run: poetry run python scripts/dev.py type-check --evidence-dir "$RUNNER_TEMP/python-quality/types"
      - name: Issue references
        if: ${{ !cancelled() }}
        run: poetry run python scripts/dev.py ticket-references --evidence-dir "$RUNNER_TEMP/python-quality/references"
      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-quality
          path: ${{ runner.temp }}/python-quality
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  tests:
    name: ${{ matrix.name }} Tests (Unit/Integration)
    runs-on: ${{ matrix.os }}
    # Compressed routing removes the exhaustive per-digit durable publication workload.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: Linux, artifact: linux, timeout: 30}
          - {os: windows-2025, name: Windows, artifact: windows, timeout: 45}
          - {os: macos-15, name: MacOS, artifact: macos, timeout: 30}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - name: Select interpreter and install locked dependencies
        run: |
          python -c "import subprocess, sys; subprocess.run(['poetry', 'env', 'use', sys.executable], check=True)"
          python scripts/dev.py install
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: poetry run python scripts/dev.py test-unit --platform-coverage --evidence-dir "$RUNNER_TEMP/python-tests/unit"
      - name: Integration tests
        if: ${{ !cancelled() }}
        run: poetry run python scripts/dev.py test-integration --platform-coverage --evidence-dir "$RUNNER_TEMP/python-tests/integration"
      - name: Tooling unit tests
        if: ${{ !cancelled() }}
        run: poetry run python scripts/dev.py test-tooling-unit --evidence-dir "$RUNNER_TEMP/python-tooling-unit"
      # Stable names belong to this run. Partial reruns replace only their own
      # platform's unit and integration evidence; previous attempt logs remain.
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/python-tests
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Retain tooling unit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tooling-${{ matrix.artifact }}
          path: ${{ runner.temp }}/python-tooling-unit
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  coverage:
    name: Test Quality Check
    if: ${{ !cancelled() }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - name: Select interpreter and install locked dependencies
        run: |
          python -c "import subprocess, sys; subprocess.run(['poetry', 'env', 'use', sys.executable], check=True)"
          python scripts/dev.py install
      - name: Download Linux suite coverage
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tests-linux
          path: ${{ runner.temp }}/python-coverage-inputs/Linux
      - name: Download Windows suite coverage
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tests-windows
          path: ${{ runner.temp }}/python-coverage-inputs/Windows
      - name: Download macOS suite coverage
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tests-macos
          path: ${{ runner.temp }}/python-coverage-inputs/Darwin
      - name: Download Linux tooling unit evidence
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tooling-linux
          path: ${{ runner.temp }}/python-tooling-inputs/Linux/tooling-unit
      - name: Download Windows tooling unit evidence
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tooling-windows
          path: ${{ runner.temp }}/python-tooling-inputs/Windows/tooling-unit
      - name: Download macOS tooling unit evidence
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tooling-macos
          path: ${{ runner.temp }}/python-tooling-inputs/Darwin/tooling-unit
      - name: Enforce named test quality controls
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: poetry run python scripts/test_quality.py "$RUNNER_TEMP/python-coverage-inputs" --tooling-dir "$RUNNER_TEMP/python-tooling-inputs" --output-dir "$RUNNER_TEMP/python-test-quality" --base "$PR_BASE"
      - name: Retain test quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-quality
          path: ${{ runner.temp }}/python-test-quality
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Record candidate identity
        if: always()
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TEST_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ job.status }}
        run: |
          {
            printf '| Identity | Value |\n| --- | --- |\n'
            printf '| PR head | `%s` |\n' "$PR_HEAD"
            printf '| PR base | `%s` |\n' "$PR_BASE"
            printf '| Tested merge commit | `%s` |\n' "$TESTED_SHA"
            printf '| Run attempt | `%s` |\n' "$RUN_ATTEMPT"
            printf '| Native tests | %s |\n' "$TEST_RESULT"
            printf '| Test quality | %s |\n' "$QUALITY_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
